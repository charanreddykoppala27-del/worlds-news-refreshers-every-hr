<style>
/* Layout: wire-desk feed — sticky filter strip, category sections of dated bullets, newest first */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#141a24; --muted:#5b6678; --line:#dde2ea;
  --accent:#1f4fd1; --accent-soft:#e3eafb; --up:#137a4b; --down:#b3261e;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --fg:#e7ebf2; --muted:#98a3b5; --line:#262d3a;
  --accent:#7ea2ff; --accent-soft:#1d2946; --up:#4cc38a; --down:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --fg:#e7ebf2; --muted:#98a3b5; --line:#262d3a;
  --accent:#7ea2ff; --accent-soft:#1d2946; --up:#4cc38a; --down:#ff7b72; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stamp b{display:block;color:var(--fg);font-weight:500;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--accent)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:14px;margin-top:18px;border-bottom:1px solid var(--line)}
.filters button{flex:none;font:500 13px var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.filters button:hover{color:var(--fg);border-color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
section{margin-top:28px}
h2{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.x{min-width:0}
.x p{margin:0;max-width:68ch}
.src{font-size:12px;color:var(--muted);margin-top:3px}
.src a{color:var(--accent);text-decoration:none}
.src a:hover{text-decoration:underline}
.new{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}
footer{margin-top:40px;color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:24px 0}
</style>

<div class="wrap">
  <header>
    <div>
      <span class="live"><i></i>Refreshes hourly</span>
      <h1>Global Business Wire</h1>
      <p class="sub">Business headlines from every industry and region, boiled down to one line each. Newest first; the last 48 hours stay on the page.</p>
    </div>
    <div class="stamp"><b id="updated">—</b><span id="count"></span></div>
  </header>
  <nav class="filters" id="filters" aria-label="Filter by industry"></nav>
  <main id="feed"></main>
  <footer>Summaries are written from public news reports; follow the source link for the full story. Not investment advice.</footer>
</div>

<script>
(function(){
  var data; try{data=JSON.parse(document.getElementById('news-data').textContent)}catch(e){data={items:[]}}
  var items=(data.items||[]).slice().sort(function(a,b){return new Date(b.t)-new Date(a.t)});
  var order=["Markets & Economy","Global Markets","Tech & AI","Retail & Fashion","Food & Beverage","Energy & Commodities","Industrials & Autos","Healthcare & Pharma","Finance & Deals","Media & Entertainment","Real Estate","Other"];
  var cats=[];items.forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
  cats.sort(function(a,b){var x=order.indexOf(a),y=order.indexOf(b);return (x<0?99:x)-(y<0?99:y)});
  var fmtT=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'});
  var fmtD=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'});
  var fmtFull=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  var up=new Date(data.updated);
  document.getElementById('updated').textContent='Updated '+(isNaN(up)?'—':fmtFull.format(up));
  document.getElementById('count').textContent=items.length+' headlines · '+cats.length+' industries';
  var newest=items.length?new Date(items[0].t):0;
  var sel='All';try{sel=localStorage.getItem('bw-cat')||'All'}catch(e){}
  if(sel!=='All'&&cats.indexOf(sel)<0)sel='All';
  var f=document.getElementById('filters');
  ['All'].concat(cats).forEach(function(c){
    var b=document.createElement('button');b.type='button';b.id='f-'+c.replace(/\W+/g,'-');b.dataset.cat=c;
    var n=c==='All'?items.length:items.filter(function(i){return i.cat===c}).length;
    b.innerHTML=c+'<span class="n">'+n+'</span>';
    b.onclick=function(){sel=c;try{localStorage.setItem('bw-cat',c)}catch(e){}render()};
    f.appendChild(b);
  });
  function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function render(){
    [].forEach.call(f.children,function(b){b.setAttribute('aria-pressed',b.dataset.cat===sel?'true':'false')});
    var feed=document.getElementById('feed');feed.innerHTML='';
    if(!items.length){feed.innerHTML='<p class="empty">No headlines yet. The next hourly run will fill this page.</p>';return}
    cats.filter(function(c){return sel==='All'||c===sel}).forEach(function(c){
      var s=document.createElement('section');
      var h='<h2>'+esc(c)+'</h2><ul>';
      items.filter(function(i){return i.cat===c}).forEach(function(i){
        var d=new Date(i.t),today=new Date();
        var when=d.toDateString()===today.toDateString()?fmtT.format(d):fmtD.format(d);
        var isNew=newest&&(newest-d)<3*3600*1000;
        h+='<li><span class="t">'+when+'</span><div class="x"><p>'+i.text+(isNew?'<span class="new">new</span>':'')+'</p><div class="src"><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.src)+'</a></div></div></li>';
      });
      s.innerHTML=h+'</ul>';feed.appendChild(s);
    });
  }
  render();
})();
</script>
